[package]
name = "jaiba"
version = "2026.7.0"
edition = "2024"
rust-version = "1.85"
description = "Terminal password manager for KeePass vaults"
authors = ["Pombo <https://github.com/pomboverso>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rama-oi/jaiba"
homepage = "https://github.com/rama-oi/jaiba"
readme = "readme.md"
keywords = ["password-manager", "keepass", "tui", "foss", "open-source"]
categories = ["command-line-utilities"]
exclude = [
    "assets/",
    "dist/",
    ".tmp",
]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.5", features = ["derive"] }
arboard = { version = "3", features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1.0.104"
toml = "1.1.4"
keepass = { version = "0.13.20", features = ["save_kdbx4", "totp"] }
chrono = "0.4.45"
unicode-width = "0.2.2"

[profile.release]
strip = true
