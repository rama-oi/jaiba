[package]
name = "jaiba"
version = "2026.4.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal password manager for KeePass (.kdbx) vaults"
authors = ["Pombo <https://github.com/pomboverso>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rama-oi/jaiba"
homepage = "https://github.com/rama-oi/jaiba"
readme = "readme.md"
keywords = ["password-manager", "keepass", "tui", "foss", "open-source"]
categories = ["command-line-utilities"]
exclude = [
    "assets/icon_*.png",
    "assets/icon.png",
    "assets/icon-256.png",
    "assets/puma.svg",
    "assets/createIcon.sh",
    "assets/screenshots/",
    ".deploy-tools/",
    "dist/",
    ".tmp",
]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
arboard = { version = "3", features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
csv = "1"
anyhow = "1.0.104"
toml = "1.1.4"
keepass = { version = "0.13.20", features = ["save_kdbx4", "totp"] }
chrono = "0.4.45"
zeroize = "1"
url = "2"

[profile.release]
strip = true

[package.metadata.deb]
maintainer = "Pombo <https://github.com/pomboverso>"
copyright = "2026, Pombo"
license-file = ["license.md", "0"]
extended-description = """\
Jaiba is a terminal password manager built on the KeePass (.kdbx) file \
format, so your vault stays compatible with the wider KeePass ecosystem."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/jaiba", "usr/bin/", "755"],
    ["readme.md", "usr/share/doc/jaiba/README", "644"],
    ["assets/jaiba.desktop", "usr/share/applications/jaiba.desktop", "644"],
    ["assets/jaiba.svg", "usr/share/icons/hicolor/scalable/apps/jaiba.svg", "644"],
    ["assets/icon_16x16.png", "usr/share/icons/hicolor/16x16/apps/jaiba.png", "644"],
    ["assets/icon_22x22.png", "usr/share/icons/hicolor/22x22/apps/jaiba.png", "644"],
    ["assets/icon_24x24.png", "usr/share/icons/hicolor/24x24/apps/jaiba.png", "644"],
    ["assets/icon_32x32.png", "usr/share/icons/hicolor/32x32/apps/jaiba.png", "644"],
    ["assets/icon_48x48.png", "usr/share/icons/hicolor/48x48/apps/jaiba.png", "644"],
    ["assets/icon_64x64.png", "usr/share/icons/hicolor/64x64/apps/jaiba.png", "644"],
    ["assets/icon_72x72.png", "usr/share/icons/hicolor/72x72/apps/jaiba.png", "644"],
    ["assets/icon_96x96.png", "usr/share/icons/hicolor/96x96/apps/jaiba.png", "644"],
    ["assets/icon_128x128.png", "usr/share/icons/hicolor/128x128/apps/jaiba.png", "644"],
    ["assets/icon_192x192.png", "usr/share/icons/hicolor/192x192/apps/jaiba.png", "644"],
    ["assets/icon_256x256.png", "usr/share/icons/hicolor/256x256/apps/jaiba.png", "644"],
    ["assets/icon_512x512.png", "usr/share/icons/hicolor/512x512/apps/jaiba.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/jaiba", dest = "/usr/bin/jaiba", mode = "755" },
    { source = "readme.md", dest = "/usr/share/doc/jaiba/README", mode = "644" },
    { source = "assets/jaiba.desktop", dest = "/usr/share/applications/jaiba.desktop", mode = "644" },
    { source = "assets/jaiba.svg", dest = "/usr/share/icons/hicolor/scalable/apps/jaiba.svg", mode = "644" },
    { source = "assets/icon_16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_22x22.png", dest = "/usr/share/icons/hicolor/22x22/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_24x24.png", dest = "/usr/share/icons/hicolor/24x24/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_72x72.png", dest = "/usr/share/icons/hicolor/72x72/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_96x96.png", dest = "/usr/share/icons/hicolor/96x96/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_192x192.png", dest = "/usr/share/icons/hicolor/192x192/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/jaiba.png", mode = "644" },
    { source = "assets/icon_512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/jaiba.png", mode = "644" },
]
